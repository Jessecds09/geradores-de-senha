<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas Seguras 🔒</h1>
        <div class="controls">
            <label>
                Comprimento da senha:
                <input type="number" id="length" min="4" max="32" value="12">
            </label>
            <label>
                <input type="checkbox" id="uppercase" checked>
                Letras maiúsculas
            </label>
            <label>
                <input type="checkbox" id="numbers" checked>
                Números
            </label>
            <label>
                <input type="checkbox" id="symbols">
                Símbolos
            </label>
        </div>
        <button id="generate">Gerar Senha</button>
        <input type="text" id="password" readonly placeholder="Sua senha aparecerá aqui">
    </div>

    <script src="script.js"></script>
</body>
</html>
